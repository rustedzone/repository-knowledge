# Pin this package version to the same tag used by the central include.
variables:
  REPO_KNOWLEDGE_TOOLKIT_PROJECT_ID: ""
  REPO_KNOWLEDGE_TOOLKIT_VERSION: "v0.6.1"
  REPO_KNOWLEDGE_ENFORCEMENT: "advisory"

repository-knowledge:documentation-impact:
  stage: test
  image: alpine:3.21
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
  before_script:
    - apk add --no-cache curl git
  script:
    - |
      set -eu
      test -n "${REPO_KNOWLEDGE_TOOLKIT_PROJECT_ID}" || {
        echo "REPO_KNOWLEDGE_TOOLKIT_PROJECT_ID is required"
        exit 2
      }
      TOOLKIT_DIR="$(mktemp -d)"
      case "$(uname -m)" in
        x86_64) TOOLKIT_ARCH=amd64 ;;
        aarch64|arm64) TOOLKIT_ARCH=arm64 ;;
        *) echo "unsupported runner architecture $(uname -m)"; exit 2 ;;
      esac
      TOOLKIT_NAME="repo-knowledge-linux-${TOOLKIT_ARCH}"
      PACKAGE_URL="${CI_API_V4_URL}/projects/${REPO_KNOWLEDGE_TOOLKIT_PROJECT_ID}/packages/generic/repository-knowledge/${REPO_KNOWLEDGE_TOOLKIT_VERSION}"
      curl --fail --silent --show-error --location --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --output "${TOOLKIT_DIR}/${TOOLKIT_NAME}" "${PACKAGE_URL}/${TOOLKIT_NAME}"
      curl --fail --silent --show-error --location --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --output "${TOOLKIT_DIR}/SHA256SUMS" "${PACKAGE_URL}/SHA256SUMS"
      grep " ${TOOLKIT_NAME}$" "${TOOLKIT_DIR}/SHA256SUMS" | sed "s# ${TOOLKIT_NAME}$# ${TOOLKIT_DIR}/${TOOLKIT_NAME}#" | sha256sum -c -
      chmod +x "${TOOLKIT_DIR}/${TOOLKIT_NAME}"
      BASE_SHA="${CI_MERGE_REQUEST_DIFF_BASE_SHA:-$CI_COMMIT_BEFORE_SHA}"
      if [ -z "${BASE_SHA}" ] || echo "${BASE_SHA}" | grep -q '^0\{40\}$'; then
        BASE_SHA="$(git -C "${CI_PROJECT_DIR}" hash-object -t tree /dev/null)"
      fi
      git -C "${CI_PROJECT_DIR}" cat-file -e "${BASE_SHA}^{tree}" 2>/dev/null || git -C "${CI_PROJECT_DIR}" fetch --quiet --depth 1 origin "${BASE_SHA}"
      set +e
      "${TOOLKIT_DIR}/${TOOLKIT_NAME}" validate-doc-impact --target "${CI_PROJECT_DIR}" --base "${BASE_SHA}" --head "${CI_COMMIT_SHA}" --mode "${REPO_KNOWLEDGE_ENFORCEMENT}" --json > repository-knowledge-impact.json
      VALIDATION_STATUS="$?"
      set -e
      cat repository-knowledge-impact.json
      exit "${VALIDATION_STATUS}"
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - repository-knowledge-impact.json
