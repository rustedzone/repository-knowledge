stages:
  - test
  - build
  - publish

toolkit:test:
  stage: test
  image: golang:1.25-alpine
  before_script:
    - apk add --no-cache git
  script:
    - go test ./...
    - go vet ./...
    - test -z "$(gofmt -l .)"
    - go build -trimpath -o /tmp/repo-knowledge ./cmd/repo-knowledge
    - /tmp/repo-knowledge --version

toolkit:release-build:
  stage: build
  image: golang:1.25-alpine
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - apk add --no-cache make
    - make release
  artifacts:
    expire_in: 30 days
    paths:
      - dist/

toolkit:publish-package:
  stage: publish
  image: alpine:3.21
  needs:
    - job: toolkit:release-build
      artifacts: true
  rules:
    - if: '$CI_COMMIT_TAG'
  before_script:
    - apk add --no-cache curl
  script:
    - test "${CI_COMMIT_TAG}" = "v$(tr -d '\n' < VERSION)"
    - PACKAGE_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/repository-knowledge/${CI_COMMIT_TAG}"
    - for FILE in dist/repo-knowledge-* dist/LICENSE dist/SHA256SUMS; do NAME="$(basename "${FILE}")"; curl --fail --silent --show-error --location --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "${FILE}" "${PACKAGE_URL}/${NAME}"; done
