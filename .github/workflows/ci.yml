name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.14'
          cache: false

      - name: Run tests, vet, and formatting checks
        run: make check

      - name: Run race-enabled tests
        run: go test -race ./...

      - name: Build both CLIs
        run: |
          make build
          go build -trimpath -o /tmp/repo-knowledge-eval ./cmd/repo-knowledge-eval

  bootstrap-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate missing-binary bootstrap plan
        shell: pwsh
        run: |
          $Version = "v$((Get-Content VERSION -Raw).Trim())"
          $BinDir = Join-Path $env:RUNNER_TEMP 'repo-knowledge-bin'
          & ./skills/repository-knowledge/scripts/install-binary.ps1 `
            -Version $Version `
            -Repository rustedzone/repository-knowledge `
            -BinDir $BinDir `
            -AddToPath `
            -DryRun
