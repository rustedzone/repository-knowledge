name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  compatibility:
    name: Go ${{ matrix.go-version }} compatibility
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version:
          - '1.22.0'
          - '1.25.14'
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: false

      - name: Run tests, vet, and formatting checks
        run: make check

      - name: Build both CLIs
        run: |
          make build
          go build -trimpath -o /tmp/repo-knowledge-eval ./cmd/repo-knowledge-eval

  race:
    name: Race tests (Go 1.25.14)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.14'
          cache: false

      - name: Run race-enabled tests
        run: go test -race ./...

  bootstrap-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Validate missing-binary bootstrap plan
        shell: pwsh
        run: |
          $Version = "v$((Get-Content VERSION -Raw).Trim())"
          $BinDir = Join-Path $env:RUNNER_TEMP 'repo-knowledge-bin'
          & ./skills/repository-knowledge/scripts/install-binary.ps1 `
            -Version $Version `
            -Repository rustedzone/repository-knowledge `
            -BinDir $BinDir `
            -AddToPath `
            -DryRun
